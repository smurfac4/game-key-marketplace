services:
  - type: web
    name: keyspace-smurfac4
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keyspace-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax

databases:
  - name: keyspace-demo-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: keyspace_demo
    user: keyspace_app
    ipAllowList: []
