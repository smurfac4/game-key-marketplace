services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: "postgres://db:5432"
      PGUSER: ${POSTGRES_USER:?Copy .env.example to .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      PGDATABASE: ${POSTGRES_DB:?Copy .env.example to .env}
      PGSSLMODE: disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:?Generate JWT_SECRET in .env; see README}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-5173}}
      AUTH_WEB_URL: ${AUTH_WEB_URL:-}
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
